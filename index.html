<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YFY AI CLUB ‧ 旅遊性格命定盲盒測驗</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes bounce-gentle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .animate-bounce-gentle {
      animation: bounce-gentle 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-indigo-500 selection:text-white font-sans">

  <div class="w-full max-w-md bg-slate-800/90 border border-slate-700/80 rounded-2xl shadow-2xl p-6 sm:p-8 backdrop-blur-md relative overflow-hidden">
    
    <!-- 頂部裝飾背景光暈 -->
    <div class="absolute -top-12 -right-12 w-36 h-36 bg-indigo-500/20 rounded-full blur-2xl pointer-events-none"></div>
    <div class="absolute -bottom-12 -left-12 w-36 h-36 bg-teal-500/20 rounded-full blur-2xl pointer-events-none"></div>

    <!-- 步驟 0：歡迎與身分識別卡 (免輸入) -->
    <div id="step-welcome" class="space-y-6">
      <div class="text-center space-y-2">
        <span class="inline-block px-3 py-1 bg-indigo-900/60 text-indigo-300 text-xs font-semibold rounded-full border border-indigo-700/50">
          ✈️ 2026 YFY AI 樂活・智造所
        </span>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">
          解鎖你的<span class="text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-teal-300">命定旅遊盲盒</span>
        </h1>
        <p class="text-sm text-slate-300">回答 3 道靈感直覺題，測出專屬於你的充電旅行風格！</p>
      </div>

      <!-- 免手動輸入專屬身分徽章 -->
      <div id="auth-badge" class="bg-emerald-950/40 border border-emerald-500/40 rounded-xl p-4 flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-emerald-500/20 flex items-center justify-center text-emerald-400 text-lg shrink-0">
          <i class="fa-solid fa-ticket"></i>
        </div>
        <div class="text-left overflow-hidden">
          <div class="text-xs text-emerald-400 font-bold flex items-center gap-1">
            <i class="fa-solid fa-circle-check text-[10px]"></i> 專屬研習身分已由信件自動就緒
          </div>
          <div id="user-display-text" class="text-sm font-semibold text-emerald-100 truncate mt-0.5">
            身分識別中...
          </div>
        </div>
      </div>

      <!-- 盲盒動態圖示 -->
      <div class="flex justify-center py-4">
        <div class="w-24 h-24 bg-gradient-to-tr from-indigo-600 to-teal-500 rounded-3xl flex items-center justify-center text-white text-4xl shadow-lg shadow-indigo-500/30 animate-bounce-gentle">
          <i class="fa-solid fa-gift"></i>
        </div>
      </div>

      <button id="btn-start" class="w-full py-3.5 px-6 bg-gradient-to-r from-indigo-500 via-purple-500 to-teal-500 hover:opacity-95 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/25 transition duration-200 transform active:scale-[0.98] flex items-center justify-center gap-2">
        <span>開啟 30 秒靈感測驗</span>
        <i class="fa-solid fa-arrow-right text-sm"></i>
      </button>
    </div>

    <!-- 步驟 1：互動測驗區 -->
    <div id="step-quiz" class="hidden space-y-6">
      <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
        <span id="question-progress" class="text-xs font-bold text-teal-400 uppercase tracking-wider">問題 1 / 3</span>
        <span class="text-xs text-slate-400"><i class="fa-regular fa-clock mr-1"></i>直覺作答</span>
      </div>

      <div class="space-y-4">
        <h2 id="question-title" class="text-lg font-bold text-slate-100 min-h-[56px] flex items-center">
          題目載入中...
        </h2>
        <div id="options-container" class="space-y-3">
          <!-- 選項由 JS 動態生成 -->
        </div>
      </div>
    </div>

    <!-- 步驟 2：盲盒開箱與任務導引區 -->
    <div id="step-result" class="hidden space-y-6">
      <div class="text-center space-y-2">
        <span class="inline-block px-3 py-1 bg-amber-500/20 text-amber-300 text-xs font-bold rounded-full border border-amber-500/30">
          🎉 命定盲盒開箱完畢
        </span>
        <div class="text-xs text-slate-400">專屬旅人角色</div>
        <h2 id="result-role-title" class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-orange-300 to-teal-300">
          計算中...
        </h2>
      </div>

      <!-- 角色核心金句卡片 -->
      <div class="bg-slate-700/40 border border-slate-600/50 rounded-xl p-4 text-center space-y-2">
        <p id="result-role-quote" class="text-sm font-medium text-slate-200 italic">
          「探索未知的角落，遇見嶄新的自己。」
        </p>
        <p id="result-role-desc" class="text-xs text-slate-400 leading-relaxed">
          分析說明
        </p>
      </div>

      <!-- 行動轉化專區 (正式外部連結) -->
      <div class="space-y-3 pt-2">
        <div class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
          <i class="fa-solid fa-bullhorn text-indigo-400"></i> 後續行動專屬連結
        </div>

        <!-- 投稿按鈕 -->
        <a id="btn-link-submit" href="https://sites.google.com/view/yfy-ai-club" target="_blank" rel="noopener noreferrer" class="block w-full py-3 px-4 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-extrabold rounded-xl text-center text-sm shadow-md shadow-orange-500/20 transition duration-150 transform active:scale-[0.98]">
          🚀 產出旅遊圖卡 ＆ 投稿搶 500 元禮券 (收件至 10/29) ↗
        </a>

        <!-- LMS 補課按鈕 -->
        <a id="btn-link-lms" href="https://lms.yfy.com/eHRD/" target="_blank" rel="noopener noreferrer" class="block w-full py-2.5 px-4 bg-slate-700/80 hover:bg-slate-700 border border-slate-600 text-slate-200 font-semibold rounded-xl text-center text-xs transition duration-150">
          📺 沒跟到直播？前往 LMS 觀看 10 月阿杰老師精華回放 ↗
        </a>
      </div>
    </div>

  </div>

  <footer class="mt-6 text-center text-xs text-slate-400">
    永豐餘 YFY AI Club ‧ 職場高效賦能方案
  </footer>

  <!-- 邏輯腳本區 -->
  <script>
    // ==========================================
    // 1. 全局配置
    // ==========================================
    const CONFIG = {
      // 正式部署的 Google Apps Script Web App URL
      GAS_ENDPOINT_URL: "https://script.google.com/macros/s/AKfycbw5qnLfoRebzDEdkuAEnGtEBFdMK7LtLtJc4kiFLF4ewzwUV2LnAjxohwBzej8ao_5g/exec",
      DEFAULT_BATCH: "oct_post",
      TOPIC_NAME: "10月旅遊性格盲盒"
    };

    // ==========================================
    // 2. 測驗題目與結果角色配置
    // ==========================================
    const QUIZ_QUESTIONS = [
      {
        title: "Q1. 終於盼到了假期，你最理想的出發心境是什麼？",
        options: [
          { text: "遠離城市喧囂，到大自然或老街徹底放空放慢", role: "慢活行者" },
          { text: "鎖定在地限定美饌與私房甜點，舌尖絕對不能妥協", role: "探味達人" },
          { text: "穿梭當代美術館或歷史古蹟，沉浸在美感與故事裡", role: "知性旅人" },
          { text: "走沒人走過的小徑、挑戰戶外探險與未知的驚喜", role: "探索先鋒" }
        ]
      },
      {
        title: "Q2. 旅程中隨身小包裡，你必定會攜帶哪一樣靈魂裝備？",
        options: [
          { text: "降噪耳機與舒服的頸枕，隨時隨地享受寧靜放鬆", role: "慢活行者" },
          { text: "私房美食地圖與便攜胃藥，為下一餐隨時做好準備", role: "探味達人" },
          { text: "高畫質相機或靈感速記本，細膩收錄光影與故事", role: "知性旅人" },
          { text: "行動電源與耐磨登山背包，隨時保持探索續航力", role: "探索先鋒" }
        ]
      },
      {
        title: "Q3. 這次旅行結束返家後，你最希望帶回什麼珍貴回憶？",
        options: [
          { text: "充飽電的平靜心靈，以及重新面對工作日常的從容", role: "慢活行者" },
          { text: "滿箱的特色名產伴手禮，以及味蕾被極致撫慰的滿足感", role: "探味達人" },
          { text: "拍滿記憶卡的藝術美照，與滿滿人文底蘊的感動", role: "知性旅人" },
          { text: "解鎖新挑戰的冒險故事，與下一次隨興出發的勇氣", role: "探索先鋒" }
        ]
      }
    ];

    const ROLE_PROFILES = {
      "慢活行者": {
        title: "🌿 京都町家 ‧ 慢活療癒行者",
        quote: "「放慢腳步，才聽得見微風與心靈交會的聲音。」",
        desc: "比起按部就班打卡，你更偏愛在小巷長椅上品嚐一杯手沖咖啡。隨性、鬆弛與自我對話，是你最佳的充電方式。"
      },
      "探味達人": {
        title: "🍜 尋味地圖 ‧ 極致饗宴老饕",
        quote: "「一座城市的靈魂，全都藏在冒著熱氣的美味佳餚裡。」",
        desc: "你的雷達永遠對排隊名店、米其林與市場在地小吃最敏感！用味蕾丈量世界的厚度，是最實在的旅行意義。"
      },
      "知性旅人": {
        title: "🏛️ 藝境巡禮 ‧ 深度美學旅人",
        quote: "「在磚瓦與畫作的紋理間，細讀歲月鐫刻的故事。」",
        desc: "博物館、獨立書店與老建築是你的避風港。旅行對你而言不只是放鬆，更是一場充實視野與心靈的靈感漫遊。"
      },
      "探索先鋒": {
        title: "🧭 荒野無界 ‧ 勇敢探索先鋒",
        quote: "「未知與挑戰，才是人生旅途最迷人的路標。」",
        desc: "不走尋常路是你的座右銘。山峰、海岸或無人小徑都能點燃你的好奇心，隨時準備迎接令人心跳加速的全新驚喜！"
      }
    };

    // ==========================================
    // 3. 讀取 URL 參數與自動辨識身分
    // ==========================================
    const urlParams = new URLSearchParams(window.location.search);
    const paramUser = urlParams.get('user') || "";
    const paramName = urlParams.get('name') || "";
    const paramBatch = urlParams.get('batch') || CONFIG.DEFAULT_BATCH;

    // 更新歡迎卡片上的持有人資訊
    const userDisplayElement = document.getElementById('user-display-text');
    if (paramName && paramUser) {
      userDisplayElement.innerText = `持有人：${paramName} (${paramUser})`;
    } else if (paramName) {
      userDisplayElement.innerText = `持有人：${paramName}`;
    } else if (paramUser) {
      userDisplayElement.innerText = `持有人：${paramUser}`;
    } else {
      userDisplayElement.innerText = `持有人：YFY 夥伴 (訪客身分)`;
    }

    // ==========================================
    // 4. 後端寫入追蹤函式 (GAS doGet)
    // ==========================================
    function logEventToGAS(action, detail) {
      try {
        const payload = new URLSearchParams({
          batch: paramBatch,
          user: paramUser,
          name: paramName,
          topic: CONFIG.TOPIC_NAME,
          action: action,
          detail: detail,
          _t: Date.now() // 防快取
        });

        const targetUrl = `${CONFIG.GAS_ENDPOINT_URL}?${payload.toString()}`;
        
        // 透過 Image Ping 送出，避免跨網域 CORS 阻擋
        const pingImg = new Image();
        pingImg.src = targetUrl;
      } catch (err) {
        console.warn("Log failed:", err);
      }
    }

    // 頁面載入完成，立即自動記錄點開信件進入
    logEventToGAS("開啟盲盒頁面", "自動完成身分就緒");

    // ==========================================
    // 5. 測驗互動狀態管理
    // ==========================================
    let currentQuestionIndex = 0;
    const selectedRoles = [];

    const stepWelcome = document.getElementById('step-welcome');
    const stepQuiz = document.getElementById('step-quiz');
    const stepResult = document.getElementById('step-result');

    const questionProgress = document.getElementById('question-progress');
    const questionTitle = document.getElementById('question-title');
    const optionsContainer = document.getElementById('options-container');

    // 點擊「開啟測驗」
    document.getElementById('btn-start').addEventListener('click', () => {
      stepWelcome.classList.add('hidden');
      stepQuiz.classList.remove('hidden');
      logEventToGAS("點擊開始測驗", "進入第 1 題");
      renderQuestion(0);
    });

    // 渲染特定題目
    function renderQuestion(index) {
      currentQuestionIndex = index;
      const q = QUIZ_QUESTIONS[index];

      questionProgress.innerText = `問題 ${index + 1} / ${QUIZ_QUESTIONS.length}`;
      questionTitle.innerText = q.title;
      optionsContainer.innerHTML = '';

      q.options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3.5 bg-slate-700/60 hover:bg-indigo-600/50 hover:border-indigo-400 border border-slate-600/80 rounded-xl text-sm font-medium text-slate-200 transition duration-150 flex items-center justify-between group";
        btn.innerHTML = `
          <span>${opt.text}</span>
          <i class="fa-solid fa-chevron-right text-xs text-slate-400 group-hover:text-white transition"></i>
        `;
        btn.addEventListener('click', () => handleOptionClick(opt.role));
        optionsContainer.appendChild(btn);
      });
    }

    // 點選答案
    function handleOptionClick(role) {
      selectedRoles.push(role);
      const nextIndex = currentQuestionIndex + 1;

      if (nextIndex < QUIZ_QUESTIONS.length) {
        renderQuestion(nextIndex);
      } else {
        finishQuiz();
      }
    }

    // 測驗結束，開箱盲盒結果
    function finishQuiz() {
      // 統計出現最多次的角色
      const frequency = {};
      let topRole = selectedRoles[0];
      let maxCount = 1;

      selectedRoles.forEach(r => {
        frequency[r] = (frequency[r] || 0) + 1;
        if (frequency[r] > maxCount) {
          maxCount = frequency[r];
          topRole = r;
        }
      });

      const profile = ROLE_PROFILES[topRole] || ROLE_PROFILES["慢活行者"];

      // 填入開箱卡片
      document.getElementById('result-role-title').innerText = profile.title;
      document.getElementById('result-role-quote').innerText = profile.quote;
      document.getElementById('result-role-desc').innerText = profile.desc;

      stepQuiz.classList.add('hidden');
      stepResult.classList.remove('hidden');

      // 寫入解鎖結果
      logEventToGAS("解鎖盲盒結果", profile.title);
    }

    // ==========================================
    // 6. 監聽外部導流點擊
    // ==========================================
    document.getElementById('btn-link-submit').addEventListener('click', () => {
      logEventToGAS("點擊外部連結", "前往 AI Club 投稿專區搶禮券");
    });

    document.getElementById('btn-link-lms').addEventListener('click', () => {
      logEventToGAS("點擊外部連結", "前往 LMS 補課精華回放");
    });
  </script>
</body>
</html>
